name: build-php-cli-windows-native-ok

on:
  push:
  pull_request:

env:
  BUILD_PHP_VERSION: 8.4.18

jobs:
  windows-native:
    if: 1
    runs-on: windows-2022
    # runs-on: windows-2025-vs2026
    strategy:
      matrix:
        php-version:
          # - "8.2.32"
          # - "8.1.34"
          # - "8.3.32"
          # - "8.4.23"
          - "8.5.8"

    steps:
      - uses: actions/checkout@v4
      - name: show environment info
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.ignorecase false
          env
          ipconfig
          uname -a
          pwd
          ipconfig /all
          # SET PATH=C:\Windows\System32\wbem;%PATH%
          # $env:PATH="C:\Windows\System32\wbem;$env:PATH"
          # $env:PATH +=";C:\Windows\System32\wbem;"
          # 显示逻辑cpu 个数
          # wmic cpu get NumberOfLogicalProcessors /value
          Write-Output (Get-WmiObject Win32_Processor).NumberOfLogicalProcessors
          # echo %NUMBER_OF_PROCESSORS%
          Write-Output $env:NUMBER_OF_PROCESSORS
          systeminfo
          echo "BUILD_PHP_VERSION=${{ matrix.php-version }}" >> $Env:GITHUB_ENV

      - name: Display VS Version
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl.exe
      - name: test php.exe
        shell: cmd
        run: |
          curl.exe -fSLo php.exe https://github.com/jingjingxyk/swoole-cli/releases/download/swoole-cli-v6.2.0.0/php.exe
          .\php.exe -m
          .\php.exe --ri curl
          .\php.exe --ri openssl
          .\php.exe --ri zlib
          .\php.exe --ri zip
          .\php.exe --ri swoole

      - name: download deps soft
        shell: cmd
        run: |
          sapi\quickstart\windows\native-build\windows-init-download.bat

      - name: install  deps soft
        shell: cmd
        run: |
          sapi\quickstart\windows\native-build\windows-init-install.bat

      - name: show deps soft
        shell: cmd
        run: |
          sapi\quickstart\windows\native-build\windows-init-show-install-result.bat

      - name: Add folder to Windows Defender exclusion list
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: show php SDK
        run: |
          $CURRENT_DIR = Get-Location
          # Start-Process cmd -ArgumentList "${CURRENT_DIR}\var\windows-build-deps\php-sdk-binary-tools\phpsdk-vs17-x64.bat -a x64  " -NoNewWindow
          cmd /c ${CURRENT_DIR}\var\native-build\php-sdk-binary-tools\phpsdk-starter.bat -h

      - name: build libs
        run: |
          cmd /c sapi\scripts\windows-native\build-libs.bat
          # cmd /c sapi\quickstart\windows\cygwin-build\download-cygwin.bat
          # cmd /c sapi\quickstart\windows\cygwin-build\install-cygwin.bat
          # cmd /c sapi\quickstart\windows\msys2-build\download-msys2.bat
          # cmd /c sapi\quickstart\windows\msys2-build\install-msys2.bat
          # cmd /c var\native-build\php-sdk-binary-tools\phpsdk-starter.bat -c vs17 -a x64  -t sapi\scripts\windows-native\library\libiconv.bat
          # cmd /c C:\msys64\msys2_shell.cmd -msys2 -defterm -no-start -here -shell bash -c "./sapi/quickstart/windows/msys2-build/install-msys2.sh"
          # cmd /c var\native-build\php-sdk-binary-tools\phpsdk-starter.bat -c vs17 -a x64  -t sapi\scripts\windows-native\library\icu.bat

      - name: run build
        run: |
          cmd /c sapi\scripts\windows-native\entry.bat
          # cmd /c var\native-build\php-sdk-binary-tools\phpsdk-starter.bat -c vs17 -a x64  -t sapi\scripts\windows-native\main.bat
          # cmd /c var\native-build\php-sdk-binary-tools\phpsdk-starter.bat -c vs17 -a x64  -t sapi\scripts\windows-native\x-show-var.bat

      - name: Show Build Result
        if: 1
        run: |
          .\var\native-build\php-src\x64\Release_TS\php.exe -v
          .\var\native-build\php-src\x64\Release_TS\php.exe -m
          .\var\native-build\php-src\x64\Release_TS\php.exe --ri openssl
          .\var\native-build\php-src\x64\Release_TS\php.exe --ri curl
          .\var\native-build\php-src\x64\Release_TS\php.exe --ri swoole
          dumpbin /DEPENDENTS ".\var\native-build\php-src\x64\Release_TS\php.exe"

      - name: production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php.exe
          retention-days: 90
          path: "var/native-build/php-src/x64/Release_TS/php.exe"

      - name: gh release
        uses: softprops/action-gh-release@v2
        if: ${{ 0 && startsWith(github.ref, 'refs/tags/') }}
        with:
          files: "var/native-build/php-src/x64/Release_TS/php.exe"
